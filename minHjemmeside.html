<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>  <!-- Titlen, der vises i browserens fane -->
    <link rel="stylesheet" href="style.css"> <!-- Jeg linker til mit CSS stylesheetet-->
</head>
<body> 

<!--Jeg opretter en uordnet liste og opretter de forskellige html-sider som listepunkter samt navngiver dem-->
    <ul>
        <li><a href="minHjemmeside.html">FORSIDE</a></li> <!-- <a> tagget betyder et link. Attributten href er referencen/filens adresse -->
        <li><a href="Videoer.html">VIDEOER</a></li>
        <li><a href="MineSamarbejder.html">MINE SAMARBEJDER</a></li>
        <li><a href="Testimonials.html">TESTIMONIALS</a></li>
        <li><a href="UGCbilleder.html">BILLEDER</a></li>
    </ul>

<!-- div (beholder) til hele forsiden. Klassen "forside" bruges til at style i CSS-->
<div class="forside"> 
<!-- Profilbilledet, hvor src er stien til billedfilen i mappen "fotos". width og height sætter størrelsen i pixels. Klassen "align center bruges til styling i CSS"-->
    <img id="forsidebillede" src="fotos/profilbillede.png"
        width="400px";
        height="460px"; 
        class="align-center"/> 

<!--div (beholder) til teksten ved siden af billedet-->
    <div class="tektst">
        <h1 class="fornavn">Caroline</h1>  <!-- Fornavn som hovedoverskrift (h1) med egen klasse, så det kan styles for sig -->
        <h1 class="efternavn">STIGAARD</h1> <!-- Efternavn som hovedoverskrift (h1) med egen klasse, så det kan styles for sig -->

    
        <p class="creator">DK UGC Creator</p> <!-- tag (p) der fortæller, hvad jeg er. Klassen "creator" bruges til styling -->
        <a id="mail" href="mailto:caroline@cscontent.dk"><img src="fotos/ikon_mail.png"></a> <!-- a tag pga. link med reference attributten href, "mailto:" åbner brugerens mailprogram med min mailadresse. Linket er et ikon (img), man klikker på. id="mail" bruges til at style det-->
</div>

<script>
// Finder billedet med id'et "forsidebillede" og gemmer det i en variabel
let forsidebillede = document.getElementById("forsidebillede");
forsidebillede.addEventListener("mouseover", function(){     // Når musen kommer ind over billedet, skiftes til et andet billede
    forsidebillede.src = "fotos/forsidebillede2.png";
});

forsidebillede.addEventListener("mouseout", function(){     // Når musen forlader billedet, skiftes tilbage til det oprindelige billede
    forsidebillede.src = "fotos/profilbillede.png";
});

</script>

</body>
</html>
